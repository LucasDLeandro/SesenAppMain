
<!-- Modal Cadastro MPM -->
<div class="modal fade" id="modalCadastroMPM" tabindex="-1" aria-labelledby="modalCadastroMPMLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="formCadastroMPM">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold" id="modalCadastroMPMLabel"><i class="bi bi-calendar-check me-2"></i>Registrar MPM Mensal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Elevador</label>
                    <select class="form-select" id="mpmElevador" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="Social 1 - M2674">Social 1 - M2674</option>
                        <option value="Social 2 - M2675">Social 2 - M2675</option>
                        <option value="Social 3 - M2676">Social 3 - M2676</option>
                        <option value="Social 4 - M2677">Social 4 - M2677</option>
                        <option value="Social 5 - M2678">Social 5 - M2678</option>
                        <option value="Serviço 6 - M2679">Serviço 6 - M2679</option>
                        <option value="Privativo 7 - M2680">Privativo 7 - M2680</option>
                        <option value="Social 8 - M2681">Social 8 - M2681</option>
                        <option value="Social 9 - M2682">Social 9 - M2682</option>
                        <option value="Privativo 10 - M2683">Privativo 10 - M2683</option>
                        <option value="Social 11 - M2684">Social 11 - M2684</option>
                        <option value="Social 12 - M2685">Social 12 - M2685</option>
                        <option value="Social 13 - M2686">Social 13 - M2686</option>
                        <option value="Serviço 14 - M2687">Serviço 14 - M2687</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Mês de Referência</label>
                    <input type="month" class="form-control" id="mpmMes" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status da Preventiva</label>
                    <select class="form-select" id="mpmStatus" required>
                        <option value="EXECUTADO">EXECUTADO</option>
                        <option value="INOPERANTE">INOPERANTE</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data de Execução</label>
                    <input type="date" class="form-control" id="mpmDataExecucao">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Ordem de Serviço</label>
                    <input type="text" class="form-control" id="mpmOS">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Técnico</label>
                    <input type="text" class="form-control" id="mpmTecnico">
                </div>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar MPM</button>
        </div>
      </form>
    </div>
  </div>
</div>
