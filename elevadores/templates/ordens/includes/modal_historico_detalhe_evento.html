<div class="modal fade modal-ordens-wrapper" id="modal-historico-detalhe-evento" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg bg-body rounded-4">
      
      <!-- HEADER -->
      <div class="modal-header border-0 pb-3 pt-4 px-4 bg-light rounded-top-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <div id="vis-evento-icon-container" class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;">
            <i id="vis-evento-icon" class="bi bi-info-circle-fill fs-4"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bolder mb-0 text-dark" id="vis-evento-titulo">Detalhes do Evento</h5>
          </div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div id="vis-evento-badge"></div>
          <button type="button" class="btn btn-secondary btn-sm px-3 rounded-pill fw-semibold shadow-sm" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i> Fechar
          </button>
        </div>
      </div>
      
      <!-- BODY -->
      <div class="modal-body modal-ordens-body px-4 py-4" style="background-color: #f8f9fa;">
        
        <div class="row g-4">
          <!-- MAIN INFO COLUMN (LEFT) -->
          <div class="col-md-7 d-flex flex-column gap-4">
            
            <!-- Principal Info Card -->
            <div class="card card-compact border-0 shadow-sm rounded-4">
              <div class="card-body p-4">
                 <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                       <h6 class="fw-bold text-secondary text-uppercase mb-1" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                          <i class="bi bi-info-circle me-2"></i> Informações Principais
                       </h6>
                    </div>
                 </div>
                 
                 <div class="row g-compact">
                    <div class="col-md-6">
                       <small class="text-muted text-uppercase fw-bold d-block" style="font-size: 0.7rem;">Elevador</small>
                       <span class="fs-6 fw-bold text-dark" id="vis-evento-elevador"></span>
                    </div>
                    <div class="col-md-6">
                       <small class="text-muted text-uppercase fw-bold d-block" style="font-size: 0.7rem;">Data / Hora</small>
                       <span class="fs-6 fw-semibold text-dark" id="vis-evento-datahora"></span>
                    </div>
                 </div>
              </div>
            </div>

            <!-- Descrição Card -->
            <div class="card card-compact border-0 shadow-sm rounded-4 flex-grow-1">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                <h6 class="fw-bold text-secondary text-uppercase mb-0" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                  <i class="bi bi-chat-left-text me-2"></i> Detalhes / Descrição
                </h6>
              </div>
              <div class="card-body p-4 pt-3">
                <p class="mb-0 text-dark" id="vis-evento-detalhes" style="line-height: 1.6; font-size: 0.95rem;"></p>
              </div>
            </div>

          </div>

          <!-- SIDEBAR COLUMN (RIGHT) -->
          <div class="col-md-5 d-flex flex-column gap-4">
            
            <!-- Envolvidos Card -->
            <div class="card card-compact border-0 shadow-sm rounded-4">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                <h6 class="fw-bold text-secondary text-uppercase mb-0" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                  <i class="bi bi-people me-2"></i> Envolvidos
                </h6>
              </div>
              <div class="card-body p-4">
                <div class="mb-3">
                  <small class="text-muted text-uppercase fw-bold d-block" style="font-size: 0.7rem;">Registrado Por</small>
                  <span class="fw-semibold text-dark fs-6" id="vis-evento-registrado-por">-</span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
