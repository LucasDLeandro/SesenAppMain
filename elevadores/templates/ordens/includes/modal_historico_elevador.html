<div class="modal fade modal-ordens-wrapper" id="modalHistoricoElevador" tabindex="-1" aria-labelledby="modalHistoricoElevadorTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg bg-body rounded-4">
      
      <!-- HEADER -->
      <div class="modal-header border-0 pb-3 pt-4 px-4 bg-light rounded-top-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <div class="bg-info bg-opacity-10 text-info rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;">
            <i class="bi bi-clock-history fs-4"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bolder mb-0 text-dark">Histórico do Elevador</h5>
            <small class="text-muted fw-bold fs-6" id="historicoElevadorNome">Elevador</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="fs-6 fw-bold text-secondary" id="historicoElevadorMes">Mês: 07/2026</div>
          <button type="button" class="btn btn-secondary btn-sm px-3 rounded-pill fw-semibold shadow-sm" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i> Fechar
          </button>
        </div>
      </div>
      
      <!-- BODY -->
      <div class="modal-body modal-ordens-body px-4 py-4" style="background-color: #f8f9fa;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h6 class="fw-bold text-secondary text-uppercase mb-0" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                <i class="bi bi-grid-fill me-2"></i> Painel de Eventos
            </h6>
            <span class="badge bg-secondary rounded-pill" id="historicoElevadorTotal">0 evento(s)</span>
        </div>

        <div class="row g-4" id="gridHistoricoCategorias">
            <!-- OS -->
            <div class="col-md-6">
               <div class="card card-compact border-0 shadow-sm rounded-4 h-100">
                   <div class="card card-compact-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center">
                       <h6 class="fw-bold text-primary text-uppercase mb-0" style="font-size: 0.8rem; letter-spacing: 0.5px;"><i class="bi bi-tools me-2"></i> Ordens de Serviço</h6>
                       <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3" id="badge-count-os">0</span>
                   </div>
                   <div class="card card-compact-body px-4 pb-4 pt-3" id="historico-lista-os">
                   </div>
               </div>
            </div>
            
            <!-- ALARMES -->
            <div class="col-md-6">
               <div class="card card-compact border-0 shadow-sm rounded-4 h-100">
                   <div class="card card-compact-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center">
                       <h6 class="fw-bold text-danger text-uppercase mb-0" style="font-size: 0.8rem; letter-spacing: 0.5px;"><i class="bi bi-bell-fill me-2"></i> Alarmes EMS</h6>
                       <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3" id="badge-count-alarme">0</span>
                   </div>
                   <div class="card card-compact-body px-4 pb-4 pt-3" id="historico-lista-alarme">
                   </div>
               </div>
            </div>
            
            <!-- MPM -->
            <div class="col-md-6">
               <div class="card card-compact border-0 shadow-sm rounded-4 h-100">
                   <div class="card card-compact-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center">
                       <h6 class="fw-bold text-success text-uppercase mb-0" style="font-size: 0.8rem; letter-spacing: 0.5px;"><i class="bi bi-calendar-check-fill me-2"></i> Prev. Mensal (MPM)</h6>
                       <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3" id="badge-count-mpm">0</span>
                   </div>
                   <div class="card card-compact-body px-4 pb-4 pt-3" id="historico-lista-mpm">
                   </div>
               </div>
            </div>
            
            <!-- PEÇAS -->
            <div class="col-md-6">
               <div class="card card-compact border-0 shadow-sm rounded-4 h-100">
                   <div class="card card-compact-header bg-white border-bottom-0 pt-4 pb-2 px-4 d-flex justify-content-between align-items-center">
                       <h6 class="fw-bold text-info text-uppercase mb-0" style="font-size: 0.8rem; letter-spacing: 0.5px; color: #0dcaf0 !important;"><i class="bi bi-nut-fill me-2"></i> Peças</h6>
                       <span class="badge bg-info bg-opacity-10 text-info rounded-pill px-3" id="badge-count-peca">0</span>
                   </div>
                   <div class="card card-compact-body px-4 pb-4 pt-3" id="historico-lista-peca">
                   </div>
               </div>
            </div>
        </div>

      </div>
    </div>
  </div>
</div>
