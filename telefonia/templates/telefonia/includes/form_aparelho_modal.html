<div class="modal fade" id="modal-aparelho-voip" tabindex="-1" aria-labelledby="modalAparelhoTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: #f8fafc;">
      <div class="modal-header border-0 pb-3 pt-4 px-4 bg-white shadow-sm" style="z-index: 10;">
        <h5 class="modal-title fw-bold" style="color: #0f172a;">
          <i class="bi bi-phone text-primary me-2"></i> Cadastro de Aparelho VOIP
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-aparelho-voip">
          {% csrf_token %}
          <input type="hidden" id="id_oculto_aparelho" name="id">

          <div id="aparelhos-container">
            <div class="card card-compact border-0 shadow-sm mb-3 aparelho-row" style="border-radius: 8px;">
              <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold text-primary text-uppercase m-0" style="letter-spacing: 0.5px;">
                      <i class="bi bi-cpu me-2 fs-6"></i> Detalhes do Dispositivo
                    </h6>
                    <button type="button" class="btn btn-sm btn-outline-danger btn-remove-aparelho d-none" title="Remover Aparelho">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
                <div class="row g-compact">
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >Patrimônio</label>
                    <input type="text" class="form-control uppercase-text shadow-none input-patrimonio" name="patrimonio" maxlength="10" required style="border-radius: 4px; border-color: var(--border-color);">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >Modelo</label>
                    <input type="text" class="form-control uppercase-text shadow-none input-modelo" name="modelo" maxlength="30" style="border-radius: 4px; border-color: var(--border-color);">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >Função</label>
                    <select class="form-select shadow-none input-funcao" name="funcao_aparelho" style="border-radius: 4px; border-color: var(--border-color);" required>
                      <option value="fixo" selected>Atendimento Fixo</option>
                      <option value="eventos">Para Eventos (Empréstimo)</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >FCN</label>
                    <input type="text" class="form-control uppercase-text shadow-none input-fcn" name="fcn" maxlength="15" style="border-radius: 4px; border-color: var(--border-color);">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >MAC Address</label>
                    <input type="text" class="form-control uppercase-text shadow-none input-mac" name="mac_address" maxlength="20" style="border-radius: 4px; border-color: var(--border-color);">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-muted fw-bold text-uppercase mb-1" >Integridade</label>
                    <select class="form-select shadow-none input-integridade" name="integridade" style="border-radius: 4px; border-color: var(--border-color);">
                      <option value="funciona" selected>Funciona</option>
                      <option value="defeito">Defeito</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="text-start mb-2" id="div-add-aparelho">
            <button type="button" class="btn btn-sm btn-outline-primary fw-bold" id="btn-add-aparelho-row">
              <i class="bi bi-plus-circle me-1"></i> Adicionar Mais um Aparelho
            </button>
          </div>

        </form>
      </div>

      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-success px-4 shadow-sm fw-bold" style="border-radius: 8px;" form="form-aparelho-voip">
          <i class="bi bi-save me-2"></i> Salvar Aparelho(s)
        </button>
      </div>
    </div>
  </div>
</div>
