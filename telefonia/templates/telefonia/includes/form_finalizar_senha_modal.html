<div class="modal fade" id="modal-finalizar-senha" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: var(--card-bg);">
      <div class="modal-header border-0 pb-3 pt-4 px-4  shadow-sm" style="z-index: 10;">
        <h5 class="modal-title fw-bold text-warning">
          <i class="bi bi-envelope-check me-2 text-dark"></i> Finalizar e Enviar E-mail
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-finalizar-senha">
          {% csrf_token %}
          <input type="hidden" id="id_finalizacao_senha" name="id">
          
          <!-- Ação do Supervisor -->
          <div class="card card-compact border-0 shadow-sm mb-3" style="border-radius: 8px;" id="bloco_acao_supervisor_finalizacao">
            <div class="card-body p-3">
              <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-person-workspace me-2 fs-6"></i> Ação do Supervisor
              </h6>
              
              <div class="row g-compact">
                <div class="col-md-12">
                  <label class="form-label text-muted fw-bold text-uppercase mb-1" >Cargo</label>
                  <select class="form-select  shadow-none" id="cargo_finalizacao" name="cargo" onchange="toggleCargoFinalizacao(this.value)" style="border-radius: 4px; border-color: var(--border-color);">
                    <option value="servidor" selected>Servidor</option>
                    <option value="colaborador">Colaborador</option>
                  </select>
                </div>
              </div>
              
              <div id="dados_contrato_finalizacao" style="display: none;" class="bg-light p-3 rounded border mt-3">
                <h6 class="text-secondary fw-bold mb-3 d-flex align-items-center" style="text-transform: uppercase;">
                    <i class="bi bi-person-badge me-2"></i> Dados do Contrato
                </h6>
                <div class="row g-compact mb-2">
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold text-uppercase mb-1" >Selecione o Contrato</label>
                        <select class="form-select  shadow-none" id="select_contrato_finalizacao" onchange="mudarContratoFinalizacao(this.value)" style="border-radius: 4px; border-color: var(--border-color);">
                            <option value="">-- Selecione --</option>
                            <option value="novo">+ Novo Contrato</option>
                        </select>
                    </div>
                    <div class="col-md-6 div_numero_contrato_finalizacao" style="display: none;">
                        <label class="form-label text-muted fw-bold text-uppercase mb-1" >Número do Contrato</label>
                        <input type="text" class="form-control  shadow-none" id="numero_contrato_finalizacao" name="numero_contrato" maxlength="50" style="border-radius: 4px; border-color: var(--border-color);">
                    </div>
                </div>
                <div class="row g-compact mb-2">
                    <div class="col-md-6 div_empresa_finalizacao" style="display: none;">
                        <label class="form-label text-muted fw-bold text-uppercase mb-1" >Empresa Vinculada</label>
                        <input type="text" class="form-control  format-text shadow-none" id="empresa_finalizacao" name="empresa_vinculada" maxlength="100" style="border-radius: 4px; border-color: var(--border-color);">
                    </div>
                    <div class="col-md-6 div_fiscal_finalizacao" style="display: none;">
                        <label class="form-label text-muted fw-bold text-uppercase mb-1" >Fiscal do Contrato</label>
                        <input type="text" class="form-control  format-text shadow-none" id="fiscal_finalizacao" name="fiscal_contrato" maxlength="100" style="border-radius: 4px; border-color: var(--border-color);">
                    </div>
                </div>
                <div class="row g-compact">
                    <div class="col-md-12 div_unidade_fiscal_finalizacao" style="display: none;">
                        <label class="form-label text-muted fw-bold text-uppercase mb-1" >Unidade do Fiscal</label>
                        <input type="text" class="form-control  format-text shadow-none" id="unidade_fiscal_finalizacao" name="unidade_fiscal" maxlength="200" style="border-radius: 4px; border-color: var(--border-color);">
                    </div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- E-mail Modal Container -->
          <div class="card card-compact border-0 shadow-sm mb-3" style="border-radius: 8px;">
            <div style="padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; border-radius: 8px 8px 0 0; background: rgba(128, 128, 128, 0.1);">
                <i class="bi bi-envelope-paper text-primary" style="font-size: 1.1rem;"></i>
                <h6 class="mb-0 fw-bold text-uppercase" style="color: var(--text-main);">Nova Mensagem</h6>
            </div>
            
            <div style="padding: 12px; background: var(--card-bg); border-radius: 0 0 8px 8px;">
                <div class="input-group input-group-sm mb-2">
                    <span class="input-group-text  border-0 text-muted fw-semibold" style="width: 60px; background-color: transparent;">Para</span>
                    <input type="email" class="form-control  border-0 border-bottom rounded-0 px-2 shadow-none" id="email_para_finalizacao" required style="border-bottom-color: var(--border-color) !important; color: var(--text-main); background-color: transparent;">
                </div>
                
                <div class="input-group input-group-sm mb-2">
                    <span class="input-group-text  border-0 text-muted fw-semibold" style="width: 60px; background-color: transparent;">Cc/Bcc</span>
                    <input type="text" class="form-control  border-0 border-bottom rounded-0 px-2 shadow-none" id="email_copia_finalizacao" style="border-bottom-color: var(--border-color) !important; color: var(--text-main); background-color: transparent;">
                </div>

                <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text  border-0 text-muted fw-semibold" style="width: 60px; background-color: transparent;">Assunto</span>
                    <input type="text" class="form-control  border-0 border-bottom rounded-0 px-2 shadow-none fw-bold" id="email_assunto_finalizacao" required style="border-bottom-color: var(--border-color) !important; color: var(--text-main); background-color: transparent;">
                </div>
                
                <div class="form-group-modal">
                    <textarea class="form-control border-0 shadow-none px-2 py-1" id="email_corpo_finalizacao" rows="6" required style="resize: none; font-family: 'Segoe UI', system-ui, sans-serif; line-height: 1.5; color: var(--text-main); background-color: transparent;"></textarea>
                </div>
            </div>
          </div>
          
          <div class="card card-compact border-0 shadow-sm mb-2" style="border-radius: 8px;">
            <div class="card-body p-3">
              <h6 class="fw-bold text-primary mb-2 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-paperclip me-2 fs-6"></i> Anexos do E-mail
              </h6>
              <p class="text-muted mb-3" >Os documentos abaixo serão gerados automaticamente e anexados ao e-mail.</p>
              
              <div class="d-flex flex-wrap gap-2">
                  <!-- Anexo Termo -->
                  <a href="#" id="link_preview_senha" target="_blank" class="text-decoration-none" title="Clique para abrir e visualizar o documento final em uma nova aba">
                      <div class="border rounded p-2 d-flex align-items-center" style="width: fit-content; background: var(--card-bg); transition: all 0.2s; border-color: var(--border-color) !important;" onmouseover="this.style.background='var(--border-color)'" onmouseout="this.style.background='var(--card-bg)'">
                          <div class="bg-danger bg-opacity-10 rounded p-1 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                              <i class="bi bi-file-pdf-fill text-danger fs-5"></i>
                          </div>
                          <div class="pe-2">
                              <div class="fw-bold text-dark mb-0" id="nome_arquivo_senha_preview" >Documento.pdf</div>
                              <div class="text-muted" >Clique para visualizar</div>
                          </div>
                      </div>
                  </a>
                  
                  <!-- Anexo Tutorial -->
                  <a href="/telefonia/tutorial/pdf/" target="_blank" class="text-decoration-none" title="Clique para visualizar o manual de validação">
                      <div class="border rounded p-2 d-flex align-items-center" style="width: fit-content; background: var(--card-bg); transition: all 0.2s; border-color: var(--border-color) !important;" onmouseover="this.style.background='var(--border-color)'" onmouseout="this.style.background='var(--card-bg)'">
                          <div class="bg-danger bg-opacity-10 rounded p-1 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                              <i class="bi bi-file-pdf-fill text-danger fs-5"></i>
                          </div>
                          <div class="pe-2">
                              <div class="fw-bold text-dark mb-0" >Tutorial_Validacao.pdf</div>
                              <div class="text-muted" >Documento padrão</div>
                          </div>
                      </div>
                  </a>
              </div>
            </div>
          </div>
        </form>
      </div>
      
      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-warning text-dark px-4 shadow-sm fw-bold" style="border-radius: 8px;" form="form-finalizar-senha">
          <i class="bi bi-send me-2"></i> Salvar e Enviar E-mail
        </button>
      </div>
    </div>
  </div>
</div>
