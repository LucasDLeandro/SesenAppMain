<div class="modal fade" id="modal-nada-consta" tabindex="-1" aria-labelledby="modalNadaConstaTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: var(--card-bg);">
      <div class="modal-header border-0 pb-3 pt-4 px-4 shadow-sm" style="z-index: 10;">
        <h5 class="modal-title fw-bold" style="color: var(--text-main);">
          <i class="bi bi-file-earmark-check text-primary me-2"></i> Solicitação de Nada Consta
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-nada-consta">
          {% csrf_token %}
          <div class="card card-compact border-0 shadow-sm mb-3" style="border-radius: 8px;">
            <div class="card-body p-3">
              <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-info-circle me-2 fs-6"></i> Dados da Solicitação
              </h6>
              
              <div class="row g-compact">
                <div class="col-md-6">
                  <label for="data_nada_consta" class="form-label text-muted fw-bold text-uppercase mb-1">Data da Solicitação <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control shadow-none" id="data_nada_consta" name="data" required style="border-radius: 4px; border-color: var(--border-color);">
                </div>
                <div class="col-md-6">
                  <label for="protocolo_nada_consta" class="form-label text-muted fw-bold text-uppercase mb-1">Protocolo SEI <span class="text-danger">*</span></label>
                  <input type="text" class="form-control uppercase-text shadow-none" id="protocolo_nada_consta" name="protocolo" maxlength="50" required style="border-radius: 4px; border-color: var(--border-color);">
                </div>
                
                <div class="col-md-8">
                  <label for="unidade_nada_consta" class="form-label text-muted fw-bold text-uppercase mb-1">Unidade Solicitante <span class="text-danger">*</span></label>
                  <input type="text" class="form-control format-text shadow-none" id="unidade_nada_consta" name="unidade" maxlength="200" required style="border-radius: 4px; border-color: var(--border-color);">
                </div>
                <div class="col-md-4">
                  <label for="sigla_nada_consta" class="form-label text-muted fw-bold text-uppercase mb-1">Sigla <span class="text-danger">*</span></label>
                  <input type="text" class="form-control uppercase-text shadow-none" id="sigla_nada_consta" name="sigla_unidade" maxlength="20" required style="border-radius: 4px; border-color: var(--border-color);">
                </div>
                
                <div class="col-md-12">
                  <label for="servidor_nada_consta" class="form-label text-muted fw-bold text-uppercase mb-1">Nome do Servidor <span class="text-danger">*</span></label>
                  <input type="text" class="form-control format-text shadow-none" id="servidor_nada_consta" name="servidor" maxlength="200" required style="border-radius: 4px; border-color: var(--border-color);">
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4 shadow-sm fw-bold" style="border-radius: 8px;" form="form-nada-consta">
          <i class="bi bi-save me-2"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>
