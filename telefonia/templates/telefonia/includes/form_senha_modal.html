<div class="modal fade" id="modal-solicitacao-senha" tabindex="-1" aria-labelledby="modalSenhaTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: #f8fafc;">
      <div class="modal-header border-0 pb-3 pt-4 px-4 bg-white shadow-sm" style="z-index: 10;">
        <h5 class="modal-title fw-bold" style="color: #0f172a;">
          <i class="bi bi-key text-primary me-2"></i> Solicitação de Senha
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-solicitacao-senha">
          {% csrf_token %}
          <input type="hidden" id="id_oculto_senha" name="id">

          <!-- Informações Básicas -->
          <div class="card border-0 shadow-sm mb-3" style="border-radius: 8px;">
            <div class="card-body p-3">
              <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-info-circle me-2 fs-6"></i> Informações Básicas
              </h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="protocolo_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Protocolo SEI</label>
                  <input type="text" class="form-control  shadow-none" id="protocolo_senha" name="protocolo" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-6">
                  <label for="solicitante_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Solicitante <span class="text-danger">*</span></label>
                  <input type="text" class="form-control  format-text shadow-none" id="solicitante_senha" name="solicitante" maxlength="100" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-6">
                  <label for="unidade_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Unidade <span class="text-danger">*</span></label>
                  <input type="text" class="form-control  format-text shadow-none" id="unidade_senha" name="unidade" maxlength="200" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-6">
                  <label for="sigla_unidade_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Sigla da Unidade <span class="text-danger">*</span></label>
                  <input type="text" class="form-control  uppercase-text shadow-none" id="sigla_unidade_senha" name="sigla_unidade" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-12">
                  <label for="edificios_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Edifícios Permitidos</label>
                  <input type="text" class="form-control  shadow-none" id="edificios_senha" name="edificios" maxlength="100" value="Ed. Sede/Anexo" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
              </div>

              <!-- Pessoas / Senhas -->
              <div id="colaboradores-senhas-container" class="mt-4 border-top pt-3">
                <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                  <i class="bi bi-people me-2 fs-6"></i> Pessoas / Senhas a serem criadas
                </h6>
                <div id="lista_colaboradores_senhas">
                    <!-- Cards de pessoas serão inseridos aqui -->
                </div>
                <button type="button" class="btn  btn-outline-primary mt-2" id="btn-add-colaborador-senha" onclick="addColaboradorSenhaCard()">
                    <i class="bi bi-plus-circle me-1"></i> Adicionar Usuário
                </button>
              </div>
            </div>
          </div>

          <!-- Configurações e Desvio -->
          <div class="card border-0 shadow-sm mb-2" style="border-radius: 8px;">
            <div class="card-body p-3">
              <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-telephone-forward me-2 fs-6"></i> Configurações e Desvio
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="categoria_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Categoria</label>
                  <input type="text" class="form-control  shadow-none" id="categoria_senha" name="categoria" maxlength="10" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-4">
                  <label for="desvio_senha" class="form-label text-muted fw-bold text-uppercase mb-1" >Tem Desvio?</label>
                  <select class="form-select  shadow-none" id="desvio_senha" name="desvio" style="border-radius: 4px; border-color: #e2e8f0;">
                    <option value="False" selected>Não</option>
                    <option value="True">Sim</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="tel_desvio_externo" class="form-label text-muted fw-bold text-uppercase mb-1" >Tel. Desvio Externo</label>
                  <input type="text" class="form-control  shadow-none" id="tel_desvio_externo" name="tel_desvio_externo" maxlength="30" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4 shadow-sm fw-bold" style="border-radius: 8px;" form="form-solicitacao-senha">
          <i class="bi bi-save me-2"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>
