<div class="modal fade" id="modal-solicitacao-telefone" tabindex="-1" aria-labelledby="modalSolicitacaoTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: #f8fafc;">
      <div class="modal-header border-0 pb-3 pt-4 px-4 bg-white shadow-sm" style="z-index: 10;">
        <h5 class="modal-title fw-bold" style="color: #0f172a;">
          <i class="bi bi-headset text-primary me-2"></i> Solicitação de Telefone
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-solicitacao-telefone">
          {% csrf_token %}
          <input type="hidden" id="id_oculto_solicitacao" name="id">

          <div class="card card-compact border-0 shadow-sm mb-3" style="border-radius: 8px;">
            <div class="card card-compact-body p-3">
              <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                <i class="bi bi-info-circle me-2 fs-6"></i> Dados da Solicitação
              </h6>
              
              <div class="row g-compact">
                <div class="col-md-6">
                  <label for="data" class="form-label text-muted fw-bold text-uppercase mb-1" >Data e Hora da Solicitação <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control  shadow-none" id="data" name="data" required style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-6">
                  <label for="protocolo" class="form-label text-muted fw-bold text-uppercase mb-1" >Protocolo SEI</label>
                  <input type="text" class="form-control  uppercase-text shadow-none" id="protocolo" name="protocolo" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                
                <div class="col-md-4">
                  <label for="unidade" class="form-label text-muted fw-bold text-uppercase mb-1" >Unidade</label>
                  <input type="text" class="form-control  format-text shadow-none" id="unidade" name="unidade" maxlength="200" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-4">
                  <label for="sigla_unidade" class="form-label text-muted fw-bold text-uppercase mb-1" >Sigla</label>
                  <input type="text" class="form-control  uppercase-text shadow-none" id="sigla_unidade" name="sigla_unidade" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-4">
                  <label for="local" class="form-label text-muted fw-bold text-uppercase mb-1" >Local</label>
                  <input type="text" class="form-control  uppercase-text shadow-none" id="local" name="local" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                
                <div class="col-md-6">
                  <label for="solicitante" class="form-label text-muted fw-bold text-uppercase mb-1" >Solicitante <span class="text-danger">*</span></label>
                  <input type="text" class="form-control  format-text shadow-none" id="solicitante" name="solicitante" maxlength="100" required style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                <div class="col-md-6">
                  <label for="qnt_solicitada" class="form-label text-muted fw-bold text-uppercase mb-1" >Qtd. Solicitada <span class="text-danger">*</span></label>
                  <input type="number" class="form-control  shadow-none" id="qnt_solicitada" name="qnt_solicitada" required style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                
                <div class="col-md-12">
                  <label for="autorizacao_sad" class="form-label text-muted fw-bold text-uppercase mb-1" >Autorização SAD (Protocolo)</label>
                  <input type="text" class="form-control  shadow-none" id="autorizacao_sad" name="autorizacao_sad" maxlength="20" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
                
                <div class="col-md-12">
                  <label for="midia" class="form-label text-muted fw-bold text-uppercase mb-1" >Anexo/Mídia (Opcional)</label>
                  <input type="file" class="form-control shadow-none" id="midia" name="midia" style="border-radius: 4px; border-color: #e2e8f0;">
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4 shadow-sm fw-bold" style="border-radius: 8px;" form="form-solicitacao-telefone">
          <i class="bi bi-save me-2"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>
