<div class="modal fade modal-ordens-wrapper" id="modal-visualizar-aparelho" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg bg-body">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" style="color: var(--primary-blue);">
          <i class="bi bi-eye-fill me-2"></i> Detalhes do Aparelho
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body modal-ordens-body px-4">
        
        <div class="form-section-modal">
          <h6 class="form-section-title-modal">
            <i class="bi bi-info-circle"></i> Informações Gerais
          </h6>
          <div class="row mb-2">
            <div class="col-md-6">
              <strong>Patrimônio:</strong> <span id="vis-ap-patrimonio"></span>
            </div>
            <div class="col-md-6">
              <strong>Modelo:</strong> <span id="vis-ap-modelo"></span>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-6">
              <strong>FCN:</strong> <span id="vis-ap-fcn"></span>
            </div>
            <div class="col-md-6">
              <strong>MAC Address:</strong> <span id="vis-ap-mac"></span>
            </div>
          </div>
        </div>

        <div class="form-section-modal mt-3">
          <h6 class="form-section-title-modal">
            <i class="bi bi-diagram-3"></i> Status e Alocação
          </h6>
          <div class="row mb-2">
            <div class="col-md-6">
              <strong>Integridade:</strong> <span id="vis-ap-integridade"></span>
            </div>
            <div class="col-md-6">
              <strong>Status:</strong> <span id="vis-ap-status"></span>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-6">
              <strong>Ramal Vinculado:</strong> <span id="vis-ap-ramal"></span>
            </div>
            <div class="col-md-6">
              <strong>Sala/Local:</strong> <span id="vis-ap-sala"></span>
            </div>
          </div>
        </div>

      </div>
      <div class="modal-ordens-footer mt-2 mb-4 d-flex justify-content-end px-4 gap-2">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-lg me-2"></i>Fechar
        </button>
      </div>
    </div>
  </div>
</div>
