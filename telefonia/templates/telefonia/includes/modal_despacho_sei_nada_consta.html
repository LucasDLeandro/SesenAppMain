<div class="modal fade" id="modal-despacho-sei-nada-consta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white border-0 py-3">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-clipboard-check me-2"></i> Texto Padrão para Despacho SEI
                </h5>
                <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4 bg-light">
                <div class="alert alert-info border-info shadow-sm mb-4">
                    <i class="bi bi-info-circle-fill me-2"></i> 
                    Copie o texto abaixo e cole diretamente no SEI para concluir o trâmite do protocolo.
                </div>
                
                <div class="position-relative">
                    <textarea class="form-control" id="texto_despacho_sei" rows="12" readonly style="resize: none; background-color: #fff; font-family: monospace;"></textarea>
                    
                    <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 m-2 shadow-sm" onclick="copiarDespachoSei()" id="btn-copiar-sei" title="Copiar para a área de transferência">
                        <i class="bi bi-copy me-1"></i> Copiar Texto
                    </button>
                </div>
            </div>
            
            <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-end">
                <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script>
    function copiarDespachoSei() {
        var copyText = document.getElementById("texto_despacho_sei");
        copyText.select();
        copyText.setSelectionRange(0, 99999); // Mobile
        document.execCommand("copy");
        
        var btn = document.getElementById("btn-copiar-sei");
        var originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-check2-all me-1"></i> Copiado!';
        btn.classList.replace('btn-primary', 'btn-success');
        
        // SweetAlert para notificar
        if (typeof Swal !== 'undefined') {
            Swal.fire({
                icon: 'success',
                title: 'Texto Copiado!',
                text: 'O despacho SEI foi copiado para sua área de transferência.',
                timer: 1500,
                showConfirmButton: false
            });
        }
        
        setTimeout(function() {
            btn.innerHTML = originalHtml;
            btn.classList.replace('btn-success', 'btn-primary');
        }, 2000);
    }
</script>
