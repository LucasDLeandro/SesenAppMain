{% load static %}
<div class="modal fade modal-ordens-wrapper" id="modal-lista-concluir-solicitacoes" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 shadow-lg bg-body">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" style="color: var(--primary-blue);">
          <i class="bi bi-inbox-fill me-2"></i> Solicitações Recebidas
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body modal-ordens-body px-4">
        <p class="text-muted">Abaixo estão as solicitações que aguardam ação técnica (instalação ou geração de senha).</p>
        
<link rel="stylesheet" href="{% static 'telefonia/css/modal_lista_recebidas.css' %}?v=1.0">

        <div class="table-responsive tabela-modal-wrap" style="overflow-x: hidden;">
            <table id="tabela-recebidas-modal" class="table custom-modern-table table-compacta w-100">
                <thead class="custom-thead">
                    <tr>
                        <th>Data</th>
                        <th>Protocolo</th>
                        <th>Tipo</th>
                        <th style="width: 40% !important; min-width: 200px;">Unidade</th>
                        <th>Sigla</th>
                        <th>Usuário/Local</th>
                        <th>Status</th>
                        <th style="width: 20% !important;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populado via DataTables (AJAX unificado) -->
                </tbody>
            </table>
        </div>

      </div>
    </div>
  </div>
</div>
