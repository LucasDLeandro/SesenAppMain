{% load static %}
<!-- Modal Perfil de Usuário -->
<div class="modal fade" id="modal-perfil-usuario" tabindex="-1" aria-labelledby="modalPerfilLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
      
      <!-- Cabeçalho (com gradient e sem bordas duras) -->
      <div class="modal-header d-flex flex-column align-items-center justify-content-center p-4 position-relative" style="background: linear-gradient(135deg, var(--primary, #4361ee) 0%, #3a56d4 100%); color: white; border-bottom: none;">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        
        <div class="rounded-circle bg-white d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
          <i class="bi bi-person-fill" style="font-size: 3rem; color: var(--primary, #4361ee);"></i>
        </div>
        <h4 class="modal-title fw-bold m-0" id="modalPerfilLabel">Meu Perfil</h4>
      </div>

      <!-- Corpo -->
      <div class="modal-body p-4 bg-light">
        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-4">
            
            <div class="row mb-3">
              <div class="col-12 text-center">
                <h5 class="fw-bold mb-0 text-dark" id="perfil-nome">{{ user.get_full_name|default:user.username }}</h5>
                <span class="badge bg-primary mt-2 px-3 py-2 rounded-pill" id="perfil-cargo" style="font-weight: 500;">
                  {% if user.perfil %}
                    {{ user.perfil.get_tipo_display }}
                  {% else %}
                    Sem Cargo Definido
                  {% endif %}
                </span>
              </div>
            </div>

            <hr class="text-muted">

            <form id="form-meu-perfil-modal" onsubmit="salvarMeuPerfilModal(event)">
              <input type="hidden" id="modal_perfil_user_id" value="{{ request.user.id }}">
              
              <div class="row mt-4">
                <div class="col-12 mb-3">
                  <label class="form-label text-muted fw-bold mb-1 small text-uppercase">Nome de Usuário (Login)</label>
                  <input type="text" class="form-control bg-light" value="{{ request.user.username }}" readonly>
                </div>
                
                <div class="col-md-6 mb-3">
                  <label class="form-label text-muted fw-bold mb-1 small text-uppercase">Nome</label>
                  <input type="text" class="form-control" id="modal_perfil_first_name" value="{{ request.user.first_name }}">
                </div>
                
                <div class="col-md-6 mb-3">
                  <label class="form-label text-muted fw-bold mb-1 small text-uppercase">Sobrenome</label>
                  <input type="text" class="form-control" id="modal_perfil_last_name" value="{{ request.user.last_name }}">
                </div>

                <div class="col-12 mb-3">
                  <label class="form-label text-muted fw-bold mb-1 small text-uppercase">E-mail</label>
                  <input type="email" class="form-control" id="modal_perfil_email" value="{{ request.user.email }}">
                </div>
                
                <div class="col-12 mb-3">
                  <label class="form-label text-muted fw-bold mb-1 small text-uppercase">Telefone (WhatsApp)</label>
                  <input type="text" class="form-control mask-telefone" id="modal_perfil_telefone" value="{{ request.user.perfil.telefone|default:'' }}">
                  <div class="form-text">Inclua o DDD. Ex: (61) 9 9999-9999</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Rodapé -->
        <div class="modal-footer bg-light border-top-0 d-flex justify-content-between pb-4">
          <a href="{% url 'trocar_senha' %}" class="btn btn-outline-secondary rounded-pill px-4">Alterar Senha</a>
          <div>
            <button type="button" class="btn btn-secondary rounded-pill px-4 me-2" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary rounded-pill px-4">Salvar Alterações</button>
          </div>
        </div>
      </form>
      <script src="{% static 'js/perfil_modal.js' %}"></script>

    </div>
  </div>
</div>
