{% load static %}
<!-- Modal Perfil de Usuário -->
<div class="modal fade" id="modal-perfil-usuario" tabindex="-1" aria-labelledby="modalPerfilLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background-color: #f8fafc;">
      
      <!-- Cabeçalho -->
      <div class="modal-header border-0 pb-3 pt-4 px-4 shadow-sm" style="background: linear-gradient(135deg, var(--primary, #4361ee) 0%, #3a56d4 100%); z-index: 10;">
        <h5 class="modal-title fw-bold text-white d-flex align-items-center" id="modalPerfilLabel">
            <i class="bi bi-person-circle me-2 fs-5"></i> Meu Perfil
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Corpo -->
      <div class="modal-body px-4 pb-4 pt-4">
        <form id="form-meu-perfil-modal" onsubmit="salvarMeuPerfilModal(event)">
            <input type="hidden" id="modal_perfil_user_id" value="{{ request.user.id }}">
            
            <div class="card card-compact border-0 shadow-sm mb-3" style="border-radius: 8px;">
                <div class="card card-compact-body p-3 text-center">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-fill text-primary" style="font-size: 2rem;"></i>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark" id="perfil-nome" style="font-size: 0.9rem;">{{ user.get_full_name|default:user.username }}</h6>
                    <span class="badge bg-primary px-2 py-1" id="perfil-cargo" >
                        {% if user.perfil %}
                            {{ user.perfil.get_tipo_display }}
                        {% else %}
                            Sem Cargo Definido
                        {% endif %}
                    </span>
                </div>
            </div>

            <div class="card card-compact border-0 shadow-sm mb-2" style="border-radius: 8px;">
                <div class="card card-compact-body p-3">
                    <h6 class="fw-bold text-primary mb-3 text-uppercase d-flex align-items-center" style="letter-spacing: 0.5px;">
                        <i class="bi bi-person-vcard me-2 fs-6"></i> Dados Pessoais
                    </h6>
                    
                    <div class="row g-compact">
                        <div class="col-12">
                            <label class="form-label text-muted fw-bold text-uppercase mb-1" >Nome de Usuário (Login)</label>
                            <input type="text" class="form-control  bg-light shadow-none" value="{{ request.user.username }}" readonly style="border-radius: 4px; border-color: #e2e8f0;">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-bold text-uppercase mb-1" >Nome</label>
                            <input type="text" class="form-control  shadow-none" id="modal_perfil_first_name" value="{{ request.user.first_name }}" style="border-radius: 4px; border-color: #e2e8f0;">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-bold text-uppercase mb-1" >Sobrenome</label>
                            <input type="text" class="form-control  shadow-none" id="modal_perfil_last_name" value="{{ request.user.last_name }}" style="border-radius: 4px; border-color: #e2e8f0;">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted fw-bold text-uppercase mb-1" >E-mail</label>
                            <input type="email" class="form-control  shadow-none" id="modal_perfil_email" value="{{ request.user.email }}" style="border-radius: 4px; border-color: #e2e8f0;">
                        </div>
                        
                        <div class="col-12">
                            <label class="form-label text-muted fw-bold text-uppercase mb-1" >Telefone (WhatsApp)</label>
                            <input type="text" class="form-control  mask-telefone shadow-none" id="modal_perfil_telefone" value="{{ request.user.perfil.telefone|default:'' }}" style="border-radius: 4px; border-color: #e2e8f0;">
                            <div class="form-text mt-1" >Inclua o DDD. Ex: (61) 9 9999-9999</div>
                        </div>
                    </div>
                </div>
            </div>
      </div>
        
      <!-- Rodapé -->
      <div class="modal-footer border-0 px-4 pb-4 pt-1 d-flex justify-content-between">
          <a href="{% url 'trocar_senha' %}" class="btn btn-outline-secondary px-3 shadow-sm" style="border-radius: 8px;">Alterar Senha</a>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary px-3 shadow-sm" style="border-radius: 8px;" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary px-3 shadow-sm fw-bold" style="border-radius: 8px;">Salvar Alterações</button>
          </div>
      </div>
      </form>
      <script src="{% static 'js/perfil_modal.js' %}"></script>
    </div>
  </div>
</div>
