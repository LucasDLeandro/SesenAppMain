<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SesenApp - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #2b2d42;
            --text-secondary: #6c757d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container h1 {
            color: var(--primary);
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -1px;
        }

        .logo-container p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .form-floating > label {
            color: var(--text-secondary);
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1rem 0.75rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.15);
        }

        .btn-primary {
            background-color: var(--primary);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: scale(1.02);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .loading-spinner {
            display: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #fff;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <h1>SesenApp</h1>
            <p>Faça login para acessar o sistema</p>
        </div>

        <form id="login-form">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Usuário" required>
                <label for="username">Usuário</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                <label for="password">Senha</label>
            </div>
            
            <button type="submit" class="btn btn-primary d-flex justify-content-center align-items-center" id="login-btn">
                <span class="loading-spinner" id="spinner"></span>
                <span id="btn-text">Entrar</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');

            // Loading state
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Autenticando...';

            try {
                // Remove trailing slashes and ensure exact match, or use django {% url 'login' %}
                const response = await fetch('/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // CSRF is optional for JWT endpoints if properly configured, but let's just pass data
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login bem-sucedido!',
                        text: 'Redirecionando...',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = data.redirect_url || '/';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Falha no login',
                        text: data.error || 'Usuário ou senha inválidos.'
                    });
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Entrar';
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Erro de conexão',
                    text: 'Não foi possível conectar ao servidor.'
                });
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
