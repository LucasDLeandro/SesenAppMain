{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SesenApp - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}?v=1.0">
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <h1>SesenApp</h1>
            <p>Faça login para acessar o sistema</p>
        </div>

        <form id="login-form">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Usuário" required>
                <label for="username">Usuário</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                <label for="password">Senha</label>
            </div>
            
            <button type="submit" class="btn btn-primary d-flex justify-content-center align-items-center" id="login-btn">
                <span class="loading-spinner" id="spinner"></span>
                <span id="btn-text">Entrar</span>
            </button>
        </form>
    </div>

    <script src="{% static 'usuarios/js/login.js' %}?v=1.0"></script>
</body>
</html>
